<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポートフォリオ | あなたの名前</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* 全体のスタイル */
    body {
      font-family: 'Quicksand', sans-serif;
      background-color: #fef8f5;
      /* 優しいベージュ系 */
      color: #444;
      /* 文字を濃いグレーにして視認性アップ */
      margin: 0;
      padding: 0;
      text-align: center;
    }

    /* ヘッダー */
    header {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      color: white;
      padding: 50px 20px;
      font-size: 28px;
      font-weight: bold;
      border-bottom-left-radius: 50% 15px;
      border-bottom-right-radius: 50% 15px;
    }

    /* ナビゲーション */
    nav {
      margin: 20px 0;
    }

    nav a {
      text-decoration: none;
      color: #d6768a;
      font-size: 18px;
      margin: 0 15px;
      font-weight: 600;
    }

    nav a:hover {
      color: #b35f72;
    }

    /* セクション共通 */
    section {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    h2 {
      color: #d6768a;
      font-size: 22px;
    }

    /* ポートフォリオ項目 */
    .portfolio-item {
      background: #ffe9ec;
      padding: 15px;
      border-radius: 10px;
      margin: 15px 0;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      text-align: left;
    }

    .portfolio-item h3 {
      margin: 5px 0;
      color: #b35f72;
    }

    /* フッター */
    footer {
      margin-top: 40px;
      padding: 20px;
      background: #ffd1dc;
      color: #555;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    あなたのポートフォリオ
  </header>

  <nav>
    <a href="#about">自己紹介</a>
    <a href="#portfolio">制作実績</a>
    <a href="#contact">お問い合わせ</a>
  </nav>

  <section id="about">
    <h2>自己紹介</h2>
    <p>こんにちは！私はWebデザイナーとして活動しています。<br>シンプルで心地よいデザインを作るのが得意です。</p>
  </section>

  <section id="portfolio">
    <h2>制作実績</h2>

    <div class="portfolio-item">
      <h3>プロジェクト 1</h3>
      <p>ここに制作したサイトの説明を記載します。</p>
    </div>

    <div class="portfolio-item">
      <h3>プロジェクト 2</h3>
      <p>ここに制作したサイトの説明を記載します。</p>
    </div>

  </section>

  <section id="contact">
    <h2>お問い合わせ</h2>
    <p>お仕事の依頼や質問は、以下の連絡先までお願いします。</p>
    <p>Email: your.email@example.com</p>
  </section>

  <footer>
    © 2025 あなたの名前
  </footer>

</body>

</html>
