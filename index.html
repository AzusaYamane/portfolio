<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポートフォリオ | あなたの名前</title>
  <style>
    /* 全体のスタイル */
    body {
      font-family: 'Arial', sans-serif;
      background-color: #fdf7f2;
      color: #555;
      margin: 0;
      padding: 0;
    }

    /* ヘッダー */
    header {
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      color: white;
      text-align: center;
      padding: 60px 20px;
      font-size: 24px;
      font-weight: bold;
      border-bottom-left-radius: 50% 10px;
      border-bottom-right-radius: 50% 10px;
    }

    /* ナビゲーション */
    nav {
      text-align: center;
      margin-top: 20px;
    }

    nav a {
      text-decoration: none;
      color: #ee9ca7;
      margin: 0 15px;
      font-size: 18px;
      font-weight: bold;
    }

    nav a:hover {
      color: #d6768a;
    }

    /* セクション共通 */
    section {
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #d6768a;
    }

    /* ポートフォリオ項目 */
    .portfolio-item {
      background: #fbe4e6;
      padding: 15px;
      border-radius: 10px;
      margin: 15px 0;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    /* フッター */
    footer {
      text-align: center;
    }
